name: Style check

# Checks every package folder (any folder with its own .editorconfig) against its own rules.
# Violations are reported as warnings and in the job summary. No step fails the job,
# so this never blocks a merge.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  style:
    name: Style check (non-blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Find packages
        run: |
          # A package is any folder with its own .editorconfig. The baseline and CI folders are not packages.
          find . -name .editorconfig \
            -not -path './.git/*' -not -path './baseline/*' -not -path './ci/*' \
            -not -path '*/Library/*' -not -path '*/Temp/*' \
            -printf '%h\n' | sed 's#^\./##' | sort > packages.txt
          echo "Packages to check:"
          cat packages.txt

      - name: Check each package
        env:
          LANG_VERSION: "9.0"
        run: |
          {
            echo "## Style check results"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ ! -s packages.txt ]; then
            echo "No packages with an .editorconfig found. Nothing to check." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          while read -r pkg; do
            echo "::group::$pkg"
            log="$RUNNER_TEMP/check.log"
            if bash ci/check-package.sh "$pkg" > "$log" 2>&1; then
              echo "- \`$pkg\`: clean" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- \`$pkg\`: violations found" >> "$GITHUB_STEP_SUMMARY"
              echo "::warning title=Style violations::$pkg has style or doc warnings. This check does not block merging."
              {
                echo
                echo "<details><summary>$pkg output</summary>"
                echo
                echo '```'
                head -n 300 "$log"
                echo '```'
                echo "</details>"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            cat "$log"
            echo "::endgroup::"
          done < packages.txt

          # Always succeed: this check reports, it does not block.
          exit 0
